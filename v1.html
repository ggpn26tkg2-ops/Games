<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Joy Ride</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#10131e;color:white;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}body{display:grid;place-items:center;min-height:100dvh}#game{width:100%;max-width:1000px;height: min(100dvh,680px);min-height:420px;position:relative;overflow:hidden;background:#131525;touch-action:none;user-select:none;-webkit-user-select:none}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#brand{font-size:17px;font-weight:1000;font-style:italic;color:#ff7cba;text-shadow:1px 2px #141222;letter-spacing:1px}#mission{font-size:12px;background:#101725d9;border-left:3px solid #5ff4df;padding:7px 9px;margin-top:6px;max-width:200px;line-height:1.25}#stats{text-align:right;font-size:13px;font-weight:800;text-shadow:1px 2px #000}#stars{color:#ffda69;letter-spacing:2px}#stick{position:absolute;bottom:20px;left:16px;width:112px;height:112px;border-radius:50%;background:#10152588;border:2px solid #ffffff44;touch-action:none}#knob{position:absolute;left:32px;top:32px;width:44px;height:44px;border-radius:50%;background:#e1e6ff66;border:2px solid #fff9;pointer-events:none}#actions{position:absolute;right:14px;bottom:22px;display:flex;gap:9px;align-items:end}button{font:800 12px system-ui;color:white;background:#15243ddc;border:1px solid #b9cbf9aa;border-radius:17px;width:68px;height:57px;touch-action:none;cursor:pointer}button:active{background:#546385}#act{background:#a02b79dd;border-color:#ff8fc8}#boost{background:#126c72db;border-color:#7df7e5}#tip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#d3d6e6;white-space:nowrap;pointer-events:none}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#101525c9;padding:18px;z-index:3}#overlay>div{max-width:340px;text-align:center;padding:24px;border:1px solid #ec6ea988;border-radius:20px;background:#171d32ee;box-shadow:0 0 40px #e755a33b}h1{font-size:38px;line-height:.9;margin:0 0 15px;font-weight:1000;font-style:italic;color:#ff75bd;text-shadow:3px 3px #552857}p{font-size:14px;line-height:1.5;color:#e2e5f3}#start{width:100%;height:48px;background:#b53383;border-color:#ff93cb;font-size:15px}#overlay[hidden]{display:none}@media(orientation:landscape) and (max-height:500px){#game{height:100dvh;min-height:300px}#stick{width:100px;height:100px;bottom:12px}#knob{left:26px;top:26px}#actions{bottom:12px}}
</style></head><body><main id="game"><canvas id="screen" aria-label="Top-down city game"></canvas><div id="hud"><div><div id="brand">JOY RIDE</div><div id="mission"></div></div><div id="stats"><div id="cash">$0</div><div id="stars">☆☆☆</div><div id="speed"></div></div></div><div id="stick" aria-label="Movement joystick"><div id="knob"></div></div><div id="actions"><button id="act">ENTER</button><button id="boost">SPRINT</button></div><div id="tip">Move • Enter / exit • Follow the diamond</div><div id="overlay"><div><h1>JOY<br>RIDE</h1><p>1980s-inspired coastal sandbox.<br>Explore the city, drive cars, deliver packages and outrun patrols.</p><p>Touch joystick to move or steer. ENTER to get in/out. Hold BOOST to go faster.</p><button id="start">START GAME</button></div></div></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('screen'),ctx=cv.getContext('2d'),game=$('game');
const W=1800,H=1440,spacing=240,road=82,cityEnd=1320,roadsX=[120,360,600,840,1080,1320],roadsY=[120,360,600,840,1080,1320];let vw=0,vh=0,dpr=1,zoom=1,started=false,last=0,clock=0,cash=0,wanted=0,heat=0,mission=0,phase=0,flash='',flashTime=0;let driving=null;const p={x:120,y:175,a:0};const joy={x:0,y:0,id:null};let boost=false;const keys=new Set();
const lots=[],cars=[],traffic=[],police=[];const colors=['#fb589b','#54dad7','#ffd16e','#7b83ef','#ed775d','#f0f0ec'];let seed=82;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function clamp(x,a,b){return Math.min(b,Math.max(a,x))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function nearRoad(x,y){return roadsX.some(r=>Math.abs(x-r)<road/2)||roadsY.some(r=>Math.abs(y-r)<road/2)}
for(let ix=0;ix<5;ix++)for(let iy=0;iy<5;iy++){let x=roadsX[ix]+road/2+15,y=roadsY[iy]+road/2+15;let park=(ix+2*iy)%7===3;lots.push({x,y,w:128,h:128,park,c:colors[(ix*3+iy)%colors.length],n:Math.floor(rnd()*3)+1});}
for(let i=0;i<14;i++){let x=roadsX[i%6]+(i%2?26:-26),y=roadsY[(i*3+1)%6]+65;if(y>H-25)y-=130;cars.push({x,y,a:i%2?Math.PI/2:-Math.PI/2,c:colors[i%colors.length],v:0});}cars.unshift({x:145,y:220,a:Math.PI/2,c:'#ff4e97',v:0});
for(let i=0;i<11;i++){let axis=i%2;traffic.push({x:axis?roadsX[i%6]-19:rnd()*W*.73,y:axis?rnd()*H:roadsY[i%6]+19,a:axis?Math.PI/2:0,c:colors[(i+2)%6],axis,v:55+rnd()*30});}
for(let i=0;i<3;i++)police.push({x:roadsX[4+i%2],y:roadsY[i+1],a:0,c:'#e7edf8',v:0});
const jobs=[{a:{x:360,y:360},b:{x:1080,y:840},name:'Sunset courier',pay:250},{a:{x:1320,y:360},b:{x:600,y:1080},name:'Beach delivery',pay:400},{a:{x:840,y:120},b:{x:1320,y:1320},name:'Midnight express',pay:600}];
function resize(){let r=game.getBoundingClientRect();vw=r.width;vh=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);zoom=vw<500?.80:.98;}new ResizeObserver(resize).observe(game);resize();
function blocked(x,y,r=9){return x<r||y<r||x>1530-r||y>H-r||lots.some(b=>!b.park&&x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)}
function move(o,dx,dy,r){let hit=false;if(!blocked(o.x+dx,o.y,r))o.x+=dx;else hit=true;if(!blocked(o.x,o.y+dy,r))o.y+=dy;else hit=true;return hit;}
function say(s){flash=s;flashTime=2.8;}function target(){return jobs[mission%jobs.length][phase?'b':'a'];}function nearest(){let best=null,d=60;for(const c of cars){let v=dist(p,c);if(v<d){best=c;d=v;}}return best;}
function action(){if(!started)return;if(driving){let c=driving;c.v=0;let positions=[c.a+Math.PI/2,c.a-Math.PI/2,c.a+Math.PI];for(let a of positions){let x=c.x+Math.cos(a)*27,y=c.y+Math.sin(a)*27;if(!blocked(x,y)){p.x=x;p.y=y;break;}}driving=null;say('On foot');}else{let c=nearest();if(c){driving=c;p.x=c.x;p.y=c.y;say('Cruise the coast');}else say('Move closer to a parked car');}}$('act').addEventListener('click',action);
function stick(e){let r=$('stick').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),lim=r.width*.32;joy.x=x/Math.max(m,lim);joy.y=y/Math.max(m,lim);$('knob').style.transform=`translate(${joy.x*lim}px,${joy.y*lim}px)`;}$('stick').addEventListener('pointerdown',e=>{joy.id=e.pointerId;$('stick').setPointerCapture(e.pointerId);stick(e)});$('stick').addEventListener('pointermove',e=>{if(e.pointerId===joy.id)stick(e)});function unstick(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;$('knob').style.transform='';}$('stick').addEventListener('pointerup',unstick);$('stick').addEventListener('pointercancel',unstick);$('stick').addEventListener('lostpointercapture',unstick);
$('boost').addEventListener('pointerdown',e=>{boost=true;$('boost').setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])$('boost').addEventListener(ev,()=>boost=false);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e'&&!e.repeat)action();});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();boost=false;joy.x=joy.y=0;$('knob').style.transform='';});$('start').onclick=()=>{started=true;$('overlay').hidden=true;say('Find the pink car or walk to the marker');};
function update(dt){if(!started)return;clock+=dt;flashTime-=dt;let x=joy.x+(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),y=joy.y+(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);let mag=Math.min(1,Math.hypot(x,y)),fast=boost||keys.has(' ');if(driving){let c=driving;if(mag>.12){let a=Math.atan2(y,x),delta=Math.atan2(Math.sin(a-c.a),Math.cos(a-c.a));c.a+=clamp(delta,-dt*5,dt*5);c.v+=(mag*(fast?300:185)-c.v)*Math.min(1,dt*3.6);}else c.v*=Math.pow(.06,dt);let hit=move(c,Math.cos(c.a)*c.v*dt,Math.sin(c.a)*c.v*dt,15);if(hit){if(c.v>130){wanted=Math.min(3,wanted+1);heat=10;say('Collision! Lose the patrols');}c.v*=.25;}for(const t of traffic){if(dist(c,t)<26&&c.v>90){c.v*=.5;wanted=Math.min(3,wanted+1);heat=10;say('Traffic incident!');}}p.x=c.x;p.y=c.y;p.a=c.a;}else if(mag>.07){p.a=Math.atan2(y,x);move(p,Math.cos(p.a)*mag*(fast?155:105)*dt,Math.sin(p.a)*mag*(fast?155:105)*dt,8);}
for(const t of traffic){if(t.axis){t.y+=t.v*dt;if(t.y>H+30)t.y=-30;}else{t.x+=t.v*dt;if(t.x>cityEnd+25)t.x=-30;}}
if(wanted){heat-=dt;let caught=false;for(let i=0;i<wanted;i++){let c=police[i],a=Math.atan2(p.y-c.y,p.x-c.x);c.a=a;let ox=c.x,oy=c.y;move(c,Math.cos(a)*120*dt,Math.sin(a)*120*dt,11);if(Math.hypot(c.x-ox,c.y-oy)<.1){let turn=a+Math.PI/2;move(c,Math.cos(turn)*120*dt,Math.sin(turn)*120*dt,11);}if(dist(c,p)<22)caught=true;}if(caught){wanted=0;heat=0;cash=Math.max(0,cash-100);if(driving)driving.v=0;driving=null;p.x=120;p.y=175;say('Busted! $100 fine');}else if(heat<=0){wanted=0;say('Patrols lost');}}
let job=jobs[mission%jobs.length];if(dist(p,target())<42){if(!phase){phase=1;say('Package collected! Deliver it');}else{cash+=job.pay;mission++;phase=0;say('MISSION COMPLETE +$'+job.pay);}}$('cash').textContent='$'+cash.toLocaleString();$('stars').textContent='★'.repeat(wanted)+'☆'.repeat(3-wanted);$('speed').textContent=driving?Math.round(driving.v*.42)+' MPH':'ON FOOT';$('mission').textContent=(phase?'DELIVER: ':'PICK UP: ')+jobs[mission%jobs.length].name+' · '+Math.round(dist(p,target())/3)+' m';$('act').textContent=driving?'EXIT':'ENTER';$('boost').textContent=driving?'BOOST':'SPRINT';}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function line(x,y,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function palm(x,y){circle(x+4,y+5,9,'#0e263c88');circle(x,y,4,'#caa378');for(let k=0;k<5;k++){let a=k*1.256;line(x,y,x+Math.cos(a)*11,y+Math.sin(a)*11,'#267a6c',4);}}
function car(c,patrol=false){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);rect(-17,-9,37,21,'#10101b77');rect(-18,-9,36,18,c.c);rect(-7,-7,12,14,'#182c44');rect(7,-6,6,12,'#37566c');rect(-17,-8,3,5,'#ff395c');rect(-17,3,3,5,'#ff395c');rect(15,-7,3,5,'#ffe9b4');rect(15,2,3,5,'#ffe9b4');if(patrol){rect(-1,-8,4,7,Math.sin(clock*13)>0?'#ff4060':'#416dff');rect(-1,1,4,7,Math.sin(clock*13)>0?'#416dff':'#ff4060');}ctx.restore();}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);rect(0,0,vw,vh,'#182737');let camX=clamp(p.x-vw/(2*zoom),0,Math.max(0,W-vw/zoom)),camY=clamp(p.y-vh/(2*zoom),0,Math.max(0,H-vh/zoom));ctx.save();ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);rect(0,0,W,H,'#bda5a1');rect(1420,0,180,H,'#d5a988');rect(1550,0,250,H,'#205b75');for(let x=1560;x<1800;x+=22)for(let y=0;y<H;y+=93)line(x,y+Math.sin(clock+x*.03)*7,x+12,y+3,'#69c9c088',2);for(const r of roadsX){rect(r-road/2-5,0,road+10,H,'#efc0bc');rect(r-road/2,0,road,H,'#303342');for(let y=0;y<H;y+=34)line(r,y,r,y+15,'#c8a66c',2);}for(const r of roadsY){rect(0,r-road/2-5,1420,road+10,'#efc0bc');rect(0,r-road/2,1420,road,'#303342');for(let x=0;x<1420;x+=34)line(x,r,x+15,r,'#c8a66c',2);}for(const b of lots){if(b.park){rect(b.x,b.y,b.w,b.h,'#37796a');for(let j=0;j<5;j++)palm(b.x+15+j*23,b.y+20+(j%2)*60);continue;}rect(b.x+8,b.y+10,b.w,b.h,'#161f3677');rect(b.x,b.y,b.w,b.h,'#6a5072');rect(b.x+4,b.y+4,b.w-8,b.h-8,b.c);rect(b.x+13,b.y+13,b.w-26,b.h-26,'#5c4e68');rect(b.x+18,b.y+18,b.w-36,b.h-36,'#82718b');for(let k=0;k<b.n;k++){rect(b.x+23+k*30,b.y+25,19,16,'#a3a0af');rect(b.x+23+k*30,b.y+25,19,3,'#d6d4d7');}line(b.x,b.y+b.h,b.x+b.w,b.y+b.h,b.c,4);}for(let y=40;y<H;y+=78){palm(1390,y);palm(1490,y+25);}for(let y=100;y<H;y+=250){rect(1455,y,30,20,'#ff718f');rect(1495,y,22,16,'#72e1dd');}
let t=target();circle(t.x,t.y,28+Math.sin(clock*4)*5,'#5ff4df44');ctx.save();ctx.translate(t.x,t.y);ctx.rotate(Math.PI/4);rect(-10,-10,20,20,'#70ffdf');ctx.restore();for(const c of cars)car(c);for(const c of traffic)car(c);for(let i=0;i<wanted;i++)car(police[i],true);if(!driving){circle(p.x+2,p.y+3,10,'#0006');circle(p.x,p.y,8,'#feefb9');line(p.x,p.y,p.x+Math.cos(p.a)*12,p.y+Math.sin(p.a)*12,'#ff77bc',5);}ctx.restore();
let mw=88,mh=70,mx=vw-mw-12,my=81;rect(mx,my,mw,mh,'#101727df');for(const x of roadsX)line(mx+x/W*mw,my,mx+x/W*mw,my+mh,'#78808b',1);for(const y of roadsY)line(mx,my+y/H*mh,mx+cityEnd/W*mw,my+y/H*mh,'#78808b',1);rect(mx+1550/W*mw,my,(W-1550)/W*mw,mh,'#245b78');circle(mx+t.x/W*mw,my+t.y/H*mh,3,'#6fffe2');circle(mx+p.x/W*mw,my+p.y/H*mh,3,'#ff79be');for(let i=0;i<wanted;i++)circle(mx+police[i].x/W*mw,my+police[i].y/H*mh,2,'#ff544d');let sx=(t.x-camX)*zoom,sy=(t.y-camY)*zoom;if(sx<25||sx>vw-25||sy<35||sy>vh-35){let a=Math.atan2(sy-vh*.5,sx-vw*.5),r=Math.min((vw/2-28)/Math.max(.01,Math.abs(Math.cos(a))),(vh/2-80)/Math.max(.01,Math.abs(Math.sin(a))));ctx.save();ctx.translate(vw/2+Math.cos(a)*r,vh/2+Math.sin(a)*r);ctx.rotate(a);ctx.fillStyle='#6fffe2';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-7);ctx.lineTo(-8,7);ctx.fill();ctx.restore();}if(flashTime>0){ctx.font='bold 13px system-ui';ctx.textAlign='center';let fw=Math.min(vw-20,ctx.measureText(flash).width+24);rect((vw-fw)/2,vh*.24,fw,32,'#101727dc');ctx.fillStyle='#fff';ctx.fillText(flash,vw/2,vh*.24+20,vw-34);ctx.textAlign='start';}}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();</script></body></html>
